name: PRJNA279828 Nextflow CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Nextflow workflow
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Install Nextflow
      # --------------------------------------------------
      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      # --------------------------------------------------
      # 4. Validate Nextflow configuration
      # --------------------------------------------------
      - name: Validate Nextflow syntax
        run: |
          nextflow run main.nf -stub-run -ansi-log false

      # --------------------------------------------------
      # 5. Verify required project structure
      # --------------------------------------------------
      - name: Check project structure
        run: |
          test -f main.nf
          test -f nextflow.config

          test -d modules
          test -d scripts
          test -d data/metadata
          test -d resources

          test -f data/metadata/sample-metadata.tsv

          echo "Project structure validated."

      # --------------------------------------------------
      # 6. Validate metadata structure
      # --------------------------------------------------
      - name: Validate metadata
        run: |
          echo "Metadata columns:"
          head -n 1 data/metadata/sample-metadata.tsv

          echo "Number of metadata samples:"
          awk 'NR > 1 {count++} END {print count}' \
            data/metadata/sample-metadata.tsv

          echo "Number of subjects:"
          cut -f2 data/metadata/sample-metadata.tsv \
            | tail -n +2 \
            | sort -u \
            | wc -l

          echo "Timepoints:"
          cut -f12 data/metadata/sample-metadata.tsv \
            | tail -n +2 \
            | sort -n \
            | uniq -c

      # --------------------------------------------------
      # 7. Validate classifier resource
      # --------------------------------------------------
      - name: Check classifier
        run: |
          test -f resources/classifiers/silva-v4-classifier.qza
          echo "SILVA classifier found."

      # --------------------------------------------------
      # 8. Verify no raw sequencing data is committed
      # --------------------------------------------------
      - name: Check repository for raw FASTQ files
        run: |
          if git ls-files | grep -E '\.(fastq|fastq\.gz|fq|fq\.gz)$'; then
            echo "ERROR: Raw sequencing files must not be committed to Git."
            exit 1
          fi

          echo "No raw FASTQ files tracked by Git."

      # --------------------------------------------------
      # 9. Validate Nextflow modules
      # --------------------------------------------------
      - name: Validate workflow modules
        run: |
          find modules -type f -name "*.nf" -print

          echo "All Nextflow module files detected."

      # --------------------------------------------------
      # 10. CI summary
      # --------------------------------------------------
      - name: CI summary
        run: |
          echo "=========================================="
          echo "PRJNA279828 pipeline CI validation passed"
          echo "=========================================="
          echo "Study: PRJNA279828"
          echo "Pipeline: Nextflow + QIIME2"
          echo "Design: Longitudinal"
          echo "Samples: 160"
          echo "Subjects: 20"
          echo "Timepoints: 8"
          echo "=========================================="

