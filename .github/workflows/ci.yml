name: PRJNA279828 Nextflow CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Nextflow workflow
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Conda environment
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: github-ci
          environment-file: envs/github.yml
          channels: conda-forge,bioconda
          python-version: "3.11"
          auto-update-conda: true

      # 4. Verify required tools
      - name: Verify tools
        run: |
          conda info --envs
          nextflow -version
          esearch -version
          efetch -help

      # 5. Validate Nextflow workflow
      - name: Validate Nextflow workflow
        run: |
          nextflow run main.nf -stub-run -ansi-log false

      # 6. Verify required project structure
      - name: Check project structure
        run: |
          test -f main.nf
          test -f nextflow.config
          test -d modules
          test -d scripts
          test -d data/metadata
          test -d resources
          test -f data/metadata/sample-metadata.tsv

          echo "Project structure validated."

      # 7. Validate metadata structure
      - name: Validate metadata
        run: |
          echo "Metadata columns:"
          head -n 1 data/metadata/sample-metadata.tsv

          echo "Number of metadata samples:"
          awk 'NR > 1 {count++} END {print count+0}' \
            data/metadata/sample-metadata.tsv

          echo "Number of subjects:"
          cut -f2 data/metadata/sample-metadata.tsv \
            | tail -n +2 \
            | sort -u \
            | wc -l

          echo "Timepoints:"
          cut -f12 data/metadata/sample-metadata.tsv \
            | tail -n +2 \
            | sort -n \
            | uniq -c

      # 8. Validate classifier resource
      - name: Check classifier
        run: |
          test -f resources/classifiers/silva-v4-classifier.qza
          echo "SILVA classifier found."

      # 9. Verify no raw sequencing data is committed
      - name: Check repository for raw FASTQ files
        run: |
          if git ls-files | grep -E '\.(fastq|fq)(\.gz)?$'; then
            echo "ERROR: Raw sequencing files must not be committed to Git."
            exit 1
          fi

          echo "No raw FASTQ files tracked by Git."

      # 10. Validate Nextflow modules
      - name: Validate workflow modules
        run: |
          find modules -type f -name "*.nf" -print
          echo "Nextflow module files detected."

      # 11. CI summary
      - name: CI summary
        run: |
          echo "=========================================="
          echo "PRJNA279828 pipeline CI validation passed"
          echo "=========================================="
          echo "Study: PRJNA279828"
          echo "Pipeline: Nextflow + QIIME2"
          echo "Design: Longitudinal"
          echo "=========================================="